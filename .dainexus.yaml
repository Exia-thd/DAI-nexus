# .dainexus.yaml — project configuration for DAI Nexus.
#
# Every key here is optional: the tools ship with working defaults and read this
# file only to override them. Parsed by a constrained regex reader (no yaml
# dependency), so keep the shape simple — `key: value`, one per line, no spaces
# inside a value.

# ── Escalation (scripts/lite/escalate.py) ────────────────────────────────────
expertMode:
  # Which expert CLI handles HARD steps. Supported: claude | codex | gemini | agy
  activeCli: claude
  # Tried when the primary exits non-zero. Leave unset for none.
  fallbackCli: null
  # Wall-clock cap for one expert call, in seconds (clamped to 1..3600).
  # Env override: DAINEXUS_ESCALATION_TIMEOUT_SECS
  providerTimeoutSeconds: 120
  budget:
    # Stop and wait for the user after this many expert calls in one run.
    maxExpertCallsPerRun: 5
    # Above this count, require DAINEXUS_CONFIRM=1 to proceed.
    requireConfirmationAbove: 3

# ── Notes ─────────────────────────────────────────────────────────────────────
# Execution policy (deny patterns, strict/permissive/audit) lives in a separate
# file so it can be permission-controlled on its own:
#     .dainexus/execution-policy.yaml   (contract: kernel/POLICY.md)
#
# Runtime knobs that belong to a single invocation stay as environment
# variables rather than config, so a one-off run never needs an edit here:
#     DAINEXUS_PROJECT_ID    memory namespace (default: git remote or dir name)
#     DAINEXUS_MAX_OBS       memory GC threshold (default: 200)
#     DAINEXUS_NO_REDACT     set to 1 to disable secret redaction (not advised)
#     DAINEXUS_MAX_WORKERS   parallel dispatch cap (default: 4)
#     DAINEXUS_STALENESS_SECS  evidence freshness window (default: 3600)
