# .dainexus/execution-policy.yaml
# DAI Nexus execution policy. Read by scripts/lite/policy_check.py
# (guard middleware). See kernel/POLICY.md.
#
# Format constraints (parsed with a constrained regex parser — no yaml lib):
#   - Scalars: one per line as `key: value`; the value must not contain spaces.
#   - deny_patterns items: exactly `  - "pattern"` (two-space indent, dash, space).
#     Patterns are regex, matched case-insensitively against "<tool_name> <args>".
#     No double quotes inside the pattern, no inline comments on pattern lines.

# strict     -> deny match blocks the tool call (exit 1)
# permissive -> deny match warns but allows (exit 2)
# audit      -> deny match is logged only (exit 0)
mode: strict

# Every success claim requires a VERIFY block (kernel/VERIFY.md).
require_verify: true

# Max escalate.py invocations per user turn before pausing for approval.
max_escalations: 3

# Guard re-reads this file every N tool calls (policy hot-reload).
refresh_interval_ticks: 10

deny_patterns:
  - "rm\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)"
  - "git\s+push\s+.*(--force|\s-f(\s|$))"
  - "git\s+reset\s+--hard"
  - "git\s+clean\s+-[a-zA-Z]*f"
  - "DROP\s+(TABLE|DATABASE)"
  - "curl\s+[^|]*\|\s*(ba|z)?sh"
  - "wget\s+[^|]*\|\s*(ba|z)?sh"
  - "chmod\s+777"
  - "Remove-Item\s+.*-Recurse\s+.*-Force"
