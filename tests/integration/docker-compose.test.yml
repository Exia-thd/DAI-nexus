version: '3.9'

services:
  # ── DAI Nexus Node Integration Tests ──────────────────────────────────
  postgres-dainexus-node:
    image: postgres:16-alpine
    container_name: dai-nexus-dainexus-node-postgres
    environment:
      POSTGRES_DB: dainexus_node_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_dainexus_node_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d dainexus_node_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── MCP Integration Tests ─────────────────────────────────────────
  postgres-mcp:
    image: postgres:16-alpine
    container_name: dai-nexus-mcp-postgres
    environment:
      POSTGRES_DB: mcp_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5434:5432"
    volumes:
      - postgres_mcp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d mcp_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_dainexus_node_data:
  postgres_mcp_data: